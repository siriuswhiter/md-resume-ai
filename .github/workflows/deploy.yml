name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
      image_tag:
        description: "Existing image tag to deploy when build_image is false"
        required: true
        default: "main"
        type: string
      build_image:
        description: "Build and push a new image from the selected ref before deploy"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_image) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_USE_SERVER_LLM=${{ vars.NEXT_PUBLIC_USE_SERVER_LLM || 'false' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

  deploy_after_build:
    name: Deploy (after build)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_image) }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          port="${SERVER_PORT:-22}"
          ssh-keyscan -p "$port" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose file
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          ssh -p "$port" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${SERVER_APP_DIR}'"
          scp -P "$port" docker-compose.yml "${SERVER_USER}@${SERVER_HOST}:${SERVER_APP_DIR}/docker-compose.yml"

      - name: Deploy over SSH
        shell: bash
        env:
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
          DOCKER_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          LLM_DEBUG: ${{ vars.LLM_DEBUG || 'false' }}
          NEXT_PUBLIC_USE_SERVER_LLM: ${{ vars.NEXT_PUBLIC_USE_SERVER_LLM || 'false' }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || 'https://api.openai.com' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          ssh -p "$port" "${SERVER_USER}@${SERVER_HOST}" "bash -lc '
            set -euo pipefail
            cd \"${SERVER_APP_DIR}\"
            cat > .env.deploy <<EOF
          APP_PORT=${APP_PORT}
          DOCKER_IMAGE=${DOCKER_IMAGE}
          LLM_DEBUG=${LLM_DEBUG}
          NEXT_PUBLIC_USE_SERVER_LLM=${NEXT_PUBLIC_USE_SERVER_LLM}
          OPENAI_API_BASE=${OPENAI_API_BASE}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
          EOF
            cp .env.deploy .env

            if [ -n \"${GHCR_TOKEN:-}\" ]; then
              if [ -z \"${GHCR_USERNAME:-}\" ]; then
                echo \"GHCR_USERNAME is required when GHCR_TOKEN is set\"
                exit 2
              fi
              echo \"${GHCR_TOKEN}\" | docker login ghcr.io -u \"${GHCR_USERNAME}\" --password-stdin
            fi

            if command -v docker-compose >/dev/null 2>&1; then
              compose_cmd=\"docker-compose\"
            elif docker compose version >/dev/null 2>&1; then
              compose_cmd=\"docker compose\"
            else
              echo \"Neither docker-compose nor docker compose is available\"
              exit 1
            fi

            \$compose_cmd pull web
            \$compose_cmd up -d --remove-orphans

            container_id=\"\$(\$compose_cmd ps -q web)\"
            if [ -z \"\$container_id\" ]; then
              echo \"web container was not created\"
              exit 1
            fi

            i=1
            status=unknown
            while [ \$i -le 60 ]; do
              status=\"\$(docker inspect -f \"{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}\" \"\$container_id\" 2>/dev/null || echo unknown)\"
              if [ \"\$status\" = \"healthy\" ]; then
                break
              fi
              sleep 2
              i=\$((i + 1))
            done

            if [ \"\$status\" != \"healthy\" ]; then
              echo \"container health check failed: \$status\"
              \$compose_cmd logs --tail 200 web || true
              exit 1
            fi
          '"

  deploy_existing_image:
    name: Deploy (existing image)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_image }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          port="${SERVER_PORT:-22}"
          ssh-keyscan -p "$port" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose file
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          ssh -p "$port" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${SERVER_APP_DIR}'"
          scp -P "$port" docker-compose.yml "${SERVER_USER}@${SERVER_HOST}:${SERVER_APP_DIR}/docker-compose.yml"

      - name: Deploy over SSH
        shell: bash
        env:
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
          DOCKER_IMAGE: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          LLM_DEBUG: ${{ vars.LLM_DEBUG || 'false' }}
          NEXT_PUBLIC_USE_SERVER_LLM: ${{ vars.NEXT_PUBLIC_USE_SERVER_LLM || 'false' }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || 'https://api.openai.com' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          ssh -p "$port" "${SERVER_USER}@${SERVER_HOST}" "bash -lc '
            set -euo pipefail
            cd \"${SERVER_APP_DIR}\"
            cat > .env.deploy <<EOF
          APP_PORT=${APP_PORT}
          DOCKER_IMAGE=${DOCKER_IMAGE}
          LLM_DEBUG=${LLM_DEBUG}
          NEXT_PUBLIC_USE_SERVER_LLM=${NEXT_PUBLIC_USE_SERVER_LLM}
          OPENAI_API_BASE=${OPENAI_API_BASE}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
          EOF
            cp .env.deploy .env

            if [ -n \"${GHCR_TOKEN:-}\" ]; then
              if [ -z \"${GHCR_USERNAME:-}\" ]; then
                echo \"GHCR_USERNAME is required when GHCR_TOKEN is set\"
                exit 2
              fi
              echo \"${GHCR_TOKEN}\" | docker login ghcr.io -u \"${GHCR_USERNAME}\" --password-stdin
            fi

            if command -v docker-compose >/dev/null 2>&1; then
              compose_cmd=\"docker-compose\"
            elif docker compose version >/dev/null 2>&1; then
              compose_cmd=\"docker compose\"
            else
              echo \"Neither docker-compose nor docker compose is available\"
              exit 1
            fi

            \$compose_cmd pull web
            \$compose_cmd up -d --remove-orphans

            container_id=\"\$(\$compose_cmd ps -q web)\"
            if [ -z \"\$container_id\" ]; then
              echo \"web container was not created\"
              exit 1
            fi

            i=1
            status=unknown
            while [ \$i -le 60 ]; do
              status=\"\$(docker inspect -f \"{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}\" \"\$container_id\" 2>/dev/null || echo unknown)\"
              if [ \"\$status\" = \"healthy\" ]; then
                break
              fi
              sleep 2
              i=\$((i + 1))
            done

            if [ \"\$status\" != \"healthy\" ]; then
              echo \"container health check failed: \$status\"
              \$compose_cmd logs --tail 200 web || true
              exit 1
            fi
          '"
